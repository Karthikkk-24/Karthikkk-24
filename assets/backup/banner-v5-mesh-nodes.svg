<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Karthik Shettigar - Full-Stack Engineer, Security, Developer Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="meshCyan" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshViolet" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshBlue" cx="75%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topShine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameAccent" x1="72" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#meshCyan)"/>
  <rect width="1280" height="320" fill="url(#meshViolet)"/>
  <rect width="1280" height="320" fill="url(#meshBlue)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#topShine)"/>

  <!-- Right-side abstract visual -->
  <circle cx="980" cy="160" r="130" fill="#22d3ee" fill-opacity="0.06" filter="url(#softBlur)"/>
  <circle cx="1040" cy="160" r="115" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="1040" cy="160" r="88" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="1040" cy="160" r="58" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>

  <!-- Flowing connection paths (abstract, no labels) -->
  <path d="M 860 110 C 920 90, 980 130, 1040 120 S 1160 100, 1200 140" fill="none" stroke="url(#pathGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
  <path d="M 880 200 C 940 220, 1000 170, 1060 190 S 1140 230, 1180 180" fill="none" stroke="url(#pathGrad)" stroke-width="1.5" stroke-opacity="0.35"/>
  <path d="M 900 160 C 960 140, 1020 180, 1080 160" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Glowing nodes -->
  <g filter="url(#glow)">
    <circle cx="920" cy="110" r="5" fill="#22d3ee" fill-opacity="0.85"/>
    <circle cx="1040" cy="120" r="6" fill="#a78bfa" fill-opacity="0.9"/>
    <circle cx="1160" cy="100" r="4" fill="#22d3ee" fill-opacity="0.7"/>
    <circle cx="880" cy="200" r="4" fill="#34d399" fill-opacity="0.75"/>
    <circle cx="1060" cy="190" r="5" fill="#a78bfa" fill-opacity="0.8"/>
    <circle cx="1180" cy="180" r="4" fill="#34d399" fill-opacity="0.65"/>
    <circle cx="1040" cy="160" r="7" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Glass accent card -->
  <rect x="820" y="68" width="200" height="184" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="url(#glassEdge)" stroke-width="1" transform="rotate(-6 920 160)"/>
  <rect x="920" y="88" width="240" height="144" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="url(#glassEdge)" stroke-width="1" transform="rotate(4 1040 160)"/>

  <!-- Left typography -->
  <text x="72" y="96" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER</text>

  <text x="72" y="152" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.2">Karthik Shettigar</text>

  <rect x="72" y="168" width="240" height="3" fill="url(#nameAccent)" rx="1.5"/>

  <text x="72" y="204" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Full-Stack Engineer</text>
  <text x="248" y="204" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18"> &#183; </text>
  <text x="268" y="204" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Security</text>
  <text x="368" y="204" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18"> &#183; </text>
  <text x="388" y="204" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Dev Tools</text>

  <text x="72" y="238" fill="#64748b" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="13">Node.js &amp; Next.js</text>
  <text x="204" y="238" fill="#475569" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="13"> // </text>
  <text x="232" y="238" fill="#4ade80" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="13">mindrepo.online</text>

  <!-- Bottom fade -->
  <rect x="0" y="280" width="1280" height="40" fill="#050816" fill-opacity="0.5"/>
</svg>
