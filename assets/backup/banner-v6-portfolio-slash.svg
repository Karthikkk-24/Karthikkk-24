<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Karthik Shettigar - Full-Stack Engineer, Security, Developer Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="160" x2="1280" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f0518"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="72" y1="130" x2="520" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Aurora blobs -->
  <ellipse cx="1080" cy="60" rx="260" ry="140" fill="#6366f1" fill-opacity="0.45" filter="url(#blurXL)"/>
  <ellipse cx="1180" cy="200" rx="220" ry="160" fill="#06b6d4" fill-opacity="0.35" filter="url(#blurXL)"/>
  <ellipse cx="960" cy="260" rx="180" ry="100" fill="#d946ef" fill-opacity="0.22" filter="url(#blurL)"/>
  <ellipse cx="1040" cy="160" rx="120" ry="120" fill="#818cf8" fill-opacity="0.15" filter="url(#blurL)"/>

  <!-- Soft vignette -->
  <rect x="0" y="0" width="640" height="320" fill="#030712" fill-opacity="0.55"/>
  <rect x="0" y="250" width="1280" height="70" fill="#030712" fill-opacity="0.65"/>

  <!-- Content -->
  <text x="72" y="92" fill="#818cf8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3">KARTHIK SHETTIGAR</text>

  <text x="72" y="150" fill="url(#nameFill)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">Building at scale.</text>

  <text x="72" y="188" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Full-Stack Engineer specializing in Node.js, Next.js &amp; security.</text>

  <!-- Inline tags -->
  <rect x="72" y="210" width="108" height="30" rx="15" fill="url(#pill)" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
  <text x="88" y="230" fill="#e0e7ff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">MindRepo</text>

  <rect x="190" y="210" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="206" y="230" fill="#cbd5e1" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">NeoSOFT</text>

  <rect x="296" y="210" width="88" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="312" y="230" fill="#cbd5e1" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Security</text>

  <rect x="0" y="319" width="1280" height="1" fill="#ffffff" fill-opacity="0.08"/>
</svg>
